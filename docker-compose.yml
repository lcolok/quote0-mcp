version: '3.8'

services:
  # PostgreSQL 主数据库
  postgres:
    image: postgres:15-alpine
    container_name: quote0-postgres
    environment:
      POSTGRES_DB: quote0_cache
      POSTGRES_USER: quote0_user
      POSTGRES_PASSWORD: quote0_password
    ports:
      - "25432:5432"  # 使用非冲突端口
    volumes:
      - "/Volumes/Mac Mini M4 Plus APFS/ServicesData/quote0-mcp/postgres:/var/lib/postgresql/data"
      - ./docker/postgres/init:/docker-entrypoint-init-db.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote0_user -d quote0_cache"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quote0-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: quote0-minio
    environment:
      MINIO_ROOT_USER: quote0_minio
      MINIO_ROOT_PASSWORD: quote0_minio_password
    ports:
      - "29000:9000"  # API端口使用非冲突端口
      - "29001:9001"  # Web控制台端口
    volumes:
      - "/Volumes/Mac Mini M4 Plus APFS/ServicesData/quote0-mcp/minio:/data"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quote0-network

  # Redis 内存缓存
  redis:
    image: redis:7-alpine
    container_name: quote0-redis
    ports:
      - "26379:6379"  # 使用非冲突端口
    volumes:
      - "/Volumes/Mac Mini M4 Plus APFS/ServicesData/quote0-mcp/redis:/data"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - quote0-network


  # 模块化新闻API服务
  news-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: quote0-news-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      # 数据库配置（host网络模式下使用localhost）
      DATABASE_URL: postgresql://quote0_user:quote0_password@localhost:25432/quote0_cache
      # MinIO配置（host网络模式下使用localhost）
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 29000
      # Redis配置（host网络模式下使用localhost）
      REDIS_URL: redis://localhost:26379
      # 时区配置
      TZ: Asia/Shanghai
    network_mode: host
    depends_on:
      - postgres
      - minio
      - redis
    volumes:
      - ./.env:/app/.env
      - ./processed-images:/app/processed-images
      - ./src:/app/src
      - ./scripts:/app/scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 标注系统Web应用
  annotation-web:
    build:
      context: ./annotation-web
      dockerfile: Dockerfile
    container_name: quote0-annotation-web
    ports:
      - "3002:80"
    volumes:
      - ./processed-images/widgets/news:/usr/share/nginx/html/images:ro
    depends_on:
      - news-api
    networks:
      - quote0-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 应用程序服务（可选）
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: quote0-app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # 其余配置从 .env 文件读取，避免硬编码覆盖
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: ["bun", "dev"]
    restart: unless-stopped
    networks:
      - quote0-network
    profiles:
      - dev

# 注意：数据存储在 /Volumes/Mac Mini M4 Plus APFS/ServicesData/quote0-mcp/
# 如需使用命名卷，请取消下面注释并修改服务配置
# volumes:
#   postgres_data:
#     driver: local
#   minio_data:
#     driver: local
#   redis_data:
#     driver: local

networks:
  quote0-network:
    driver: bridge

# 开发环境快速启动配置
x-development: &dev-config
  profiles: ["dev"]
  
# 生产环境配置
x-production: &prod-config
  profiles: ["prod"]
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
