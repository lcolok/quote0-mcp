# 懒猫微服应用清单配置
# Quote0-MCP 智能新闻服务

lzc-sdk-version: "0.1"

# 应用唯一标识符（建议用您的域名）
package: me.friday.quote0-mcp

# 应用版本号（遵循 SemVer）
version: 1.21.38

# 应用名称
name: Quote0 新闻服务

# 应用描述
description: 智能新闻 MCP 服务系统，支持 RSS 聚合、AI 内容处理和 MindReset 设备推送

# 应用主页
homepage: https://github.com/yourname/quote0-mcp

# 作者信息
author: Friday

# 应用路由配置
application:
  subdomain: quote0
  
  # 主入口路由 - 新闻 API 服务
  routes:
    - /=http://news-api.me.friday.quote0-mcp.lzcapp:3001
    - /api=http://news-api.me.friday.quote0-mcp.lzcapp:3001/api
    - /images=http://news-api.me.friday.quote0-mcp.lzcapp:3001/images

  # 公开路径(跳过懒猫 SSO 会话登录检查，允许外部系统脚本/CLI 直连)
  # 2026-07-19：外部料号管理系统需要不登录直接调用元器件标签 API。用户确认
  # 能访问懒猫域名的都是私有网络内部，完全公开、不加 token 门槛。
  # 不要仅靠这个字段就把整个 /api 全放开，否则等于对公网裸奔。
  public_path:
    - /api/component-labels
    - /api/component-label-batches

  # 多入口配置
  entries:
    - id: api
      title: API 服务
      path: /
    - id: annotation
      title: 新闻标注系统
      path: /
      prefix_domain: annotation
    - id: labels
      title: 热敏标签设计
      path: /
      prefix_domain: labels

  upstreams:
    - location: /
      domain_prefix: annotation
      backend: http://annotation-web.me.friday.quote0-mcp.lzcapp:80
    - location: /
      domain_prefix: labels
      backend: http://label-web.me.friday.quote0-mcp.lzcapp:80

  depends_on:
    - postgres
    - minio
    - redis
  
  # 环境变量
  environment:
    NODE_ENV: production
    PORT: "3001"
    HOST: "0.0.0.0"
    TZ: Asia/Shanghai
    # 数据库连接（使用服务名）
    DATABASE_URL: postgresql://quote0_user:quote0_password@postgres:5432/quote0_cache
    # MinIO 配置
    MINIO_ENDPOINT: minio
    MINIO_PORT: "9000"
    MINIO_ACCESS_KEY: quote0_minio
    MINIO_SECRET_KEY: quote0_minio_password
    MINIO_BUCKET: quote0-images
    MINIO_USE_SSL: "false"
    # Redis 配置
    REDIS_URL: redis://redis:6379
    MINDRESET_BASE_URL: https://dot.mindreset.tech/api
    MINDRESET_DEVICE_ID: E4B063CC0F10
    MINDRESET_DEVICE_SECRET: dot_app_pVMhvUteeDqAnibZQtMofYnkJuyaMjEXzgcohArxPyJbEJgnYPTpUcRsalPnEDyr
    LLM_PROVIDER: custom
    LLM_BASE_URL: https://copilot.logic.heiyu.space/providers/kimi-for-coding/v1
    LLM_API_KEY: sk-kimi-6CEsG7VymIssuaj9A3CMnFClXIIrigTbIRKXRvdSJar95QbcfNIpYX2B1mHPcgJP
    LLM_MODEL: kimi-for-coding
    LLM_FAST_MODEL: kimi-for-coding
    LLM_MAX_TOKENS: "1000"
    LLM_TEMPERATURE: "0.7"
    # 新闻调度器
    NEWS_SCHEDULER_ENABLED: "true"
    # 懒猫环境标记
    LZC_APP: "true"
    # 2026-07-19：用户确认能访问懒猫域名的都是私有网络内部，component-labels*
    # 两个路径不再要求 Bearer token，完全公开（COMPONENT_LABELS_API_TOKEN 中间件
    # 未设置该变量时自动跳过鉴权，见 news-api-server.ts）。

  # 健康检查
  health_check:
    test_url: http://news-api.me.friday.quote0-mcp.lzcapp:3001/api/health
    timeout: 10s
    start_period: 120s

# 服务定义
services:
  # PostgreSQL 主数据库
  postgres:
    # digest 钉死：Docker pull 时密码学校验内容，tag 被覆盖污染也无法替换进来（2026-06-26 加固）
    # tag 等价物：dev.logic.heiyu.space/library/postgres:15-alpine
    image: dev.logic.heiyu.space/library/postgres@sha256:eabd2db1e68ad03f1ad9314ce52bbc05b5aa0b0fb6a70a0a29187dcd68600be9
    environment:
      POSTGRES_DB: quote0_cache
      POSTGRES_USER: quote0_user
      POSTGRES_PASSWORD: quote0_password
      TZ: Asia/Shanghai
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote0_user -d quote0_cache"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  # MinIO 对象存储
  minio:
    # digest 钉死 + 私有命名空间：密码学校验内容，污染无法替换进来（2026-06-26 加固）
    # tag 等价物：dev.logic.heiyu.space/friday/minio:latest
    image: dev.logic.heiyu.space/friday/minio@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
    environment:
      MINIO_ROOT_USER: quote0_minio
      MINIO_ROOT_PASSWORD: quote0_minio_password
    command: server /data --console-address ":9001"
    binds:
      - /lzcapp/var/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m

  # Redis 内存缓存
  redis:
    # digest 钉死 + 私有命名空间：密码学校验内容，污染无法替换进来（2026-06-26 加固）
    # tag 等价物：dev.logic.heiyu.space/friday/redis:7-alpine
    image: dev.logic.heiyu.space/friday/redis@sha256:9677a54779e2ab4fcec12638c40ef9b3d8836d4cd58d79fdc1c33dd672eddc05
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    binds:
      - /lzcapp/var/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m

  # 标注系统 Web 应用（React SPA + Nginx）
  annotation-web:
#@build if env.DEV_MODE=1
    image: dev.logic.heiyu.space/friday/quote0-annotation-web:latest
#@build else
    image: dev.logic.heiyu.space/friday/quote0-annotation-web:v1.21.38
#@build end
    depends_on:
      - news-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m

  # ADR-0002 Phase D：LLM-Gen 标签管理系统 Web 应用（React SPA + Nginx）
  label-web:
#@build if env.DEV_MODE=1
    image: dev.logic.heiyu.space/friday/quote0-label-web:v1.21.25-dev
#@build else
    image: dev.logic.heiyu.space/friday/quote0-label-web:v1.21.29
#@build end
    depends_on:
      - news-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  # 新闻 API 服务
  news-api:
#@build if env.DEV_MODE=1
    image: dev.logic.heiyu.space/friday/quote0-mcp-api:v1.21.14-dev
#@build else
    image: dev.logic.heiyu.space/friday/quote0-mcp-api:v1.21.38
#@build end
    # 长生命周期服务自愈意图。⚠️ 实测此 pkgm 版本【忽略】该字段——安装后所有容器 RestartPolicy 仍是 no。
    # 真正生效需部署后手动补：docker -H unix:///lzcsys/run/lzc-docker/docker.sock update --restart=unless-stopped mefridayquote0-mcp-news-api-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      TZ: Asia/Shanghai
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DATABASE_URL: postgresql://quote0_user:quote0_password@postgres:5432/quote0_cache
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: quote0_minio
      MINIO_SECRET_KEY: quote0_minio_password
      MINIO_BUCKET: quote0-images
      REDIS_URL: redis://redis:6379
      NEWS_SCHEDULER_ENABLED: "true"
      LZC_APP: "true"
      MINDRESET_BASE_URL: https://dot.mindreset.tech/api
      MINDRESET_DEVICE_ID: E4B063CC0F10
      MINDRESET_DEVICE_SECRET: dot_app_pVMhvUteeDqAnibZQtMofYnkJuyaMjEXzgcohArxPyJbEJgnYPTpUcRsalPnEDyr
      LLM_PROVIDER: custom
      LLM_BASE_URL: https://copilot.logic.heiyu.space/providers/kimi-for-coding/v1
      LLM_API_KEY: sk-kimi-6CEsG7VymIssuaj9A3CMnFClXIIrigTbIRKXRvdSJar95QbcfNIpYX2B1mHPcgJP
      LLM_MODEL: kimi-for-coding
      LLM_FAST_MODEL: kimi-for-coding
      LLM_MAX_TOKENS: "1000"
      LLM_TEMPERATURE: "0.7"
      EINK_DEVICES_JSON: '<set-via-lazycat-console>'
      NEWS_SCHEDULER_EXTRA_RENDERERS: 'local-eink'
      AMAP_API_KEY: dae9a4112f54312a2cef32517cc1ecbe
      # ADR-0002 Phase C: niimbot 热敏标签机 push endpoint（4 级 fallback 链的 env 兜底）
      NIIMBOT_ENDPOINT: http://192.168.31.186/api/print/raw
    depends_on:
      - postgres
      - minio
      - redis
    binds:
      - /lzcapp/var/images:/app/processed-images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 1024m

# 扩展配置
ext_config:
  enable_document_access: false
  enable_media_access: false
